function getConfigControl(f){ return document.getElementById(f.__id); }
function clearConfigError(f){
  var el=getConfigControl(f);
  var errEl=document.getElementById(f.__id+'-err');
  if(el){ el.classList.remove('invalid'); el.removeAttribute('aria-invalid'); el.removeAttribute('aria-describedby'); }
  if(errEl){ errEl.hidden=true; errEl.textContent=''; }
}
function setConfigError(f,msg){
  var el=getConfigControl(f);
  var errEl=document.getElementById(f.__id+'-err');
  if(el){ el.classList.add('invalid'); el.setAttribute('aria-invalid','true'); el.setAttribute('aria-describedby',f.__id+'-err'); }
  if(errEl){ errEl.textContent=msg; errEl.hidden=false; }
}
function readFieldValue(f){
  var el=getConfigControl(f);
  if(!el) return {missing:true};
  if(f.type==='boolean') return {value:!!el.checked};
  if(f.type==='number'){
    var raw=el.value.trim();
    if(raw==='') throw new Error('不能为空');
    var value=Number(raw);
    if(!isFinite(value)) throw new Error('请输入有效数字');
    if(f.min!=null&&value<f.min) throw new Error('不能小于 '+f.min);
    if(f.max!=null&&value>f.max) throw new Error('不能大于 '+f.max);
    return {value:value};
  }
  if(f.type==='json'){
    var parsed;
    try{ parsed=JSON.parse(el.value); }
    catch(e){ throw new Error('JSON 解析失败：'+e.message); }
    return {value:parsed};
  }
  return {value:el.value};
}
function validateConfigField(f,show){
  clearConfigError(f);
  try{
    readFieldValue(f);
    return true;
  }catch(err){
    if(show!==false) setConfigError(f,err.message);
    return false;
  }
}
function formConfigValue(){
  var out=deepCopy(S.cfg.config||{});
  S.cfg.fields.forEach(function(f){
    var el=getConfigControl(f);
    if(!el) return;
    try{
      var result=readFieldValue(f);
      if(!result.missing) out[f.key]=result.value;
    }catch(_){
      if(f.type==='number'){ var raw=el.value.trim(); out[f.key]=raw===''?'':raw; }
      else out[f.key]=el.value;
    }
  });
  return out;
}

function gatherConfig(){
  var out=deepCopy(S.cfg.config||{});
  var first=null;
  S.cfg.fields.forEach(function(f){
    clearConfigError(f);
    try{
      var result=readFieldValue(f);
      if(!result.missing) out[f.key]=result.value;
    }catch(err){
      setConfigError(f,err.message);
      if(!first) first={el:getConfigControl(f),msg:'「'+f.label+'」'+err.message};
    }
  });

    if(first.el) first.el.focus();
    var e=new Error(first.msg);

  }

async function saveConfig(){
  if(S.cfg.saving) return;
  var cfg;
  if(S.cfg.advanced){
    var ta=$('#cfg-json-ta'), errEl=$('#cfg-json-err');
    if(!ta) return;
    errEl.hidden=true; ta.removeAttribute('aria-invalid'); ta.removeAttribute('aria-describedby');
    try{ cfg=JSON.parse(ta.value); }
    catch(e){
      errEl.textContent='JSON 解析失败：'+e.message; errEl.hidden=false;
      ta.setAttribute('aria-invalid','true'); ta.setAttribute('aria-describedby','cfg-json-err');
      toast('JSON 解析失败：'+e.message,'error',5200);
      return;
    }
    if(!cfg||typeof cfg!=='object'||Array.isArray(cfg)){
      errEl.textContent='config 必须是一个 JSON 对象'; errEl.hidden=false;
      ta.setAttribute('aria-invalid','true'); ta.setAttribute('aria-describedby','cfg-json-err');
      toast('config 必须是一个 JSON 对象','error',5200);
      return;
    }
  }else{
    try{ cfg=gatherConfig(); }
    catch(err){ toast(friendlyError(err),'error',5000); return; }
  }
  S.cfg.saving=true;
  cfgStatus();
  setConfigControlsDisabled(true);
  try{
    var res=await api('/config',{method:'PUT',body:{config:cfg}});
    S.cfg.config=res.config||cfg;
    S.cfg.edit=deepCopy(S.cfg.config);
    S.cfg.file=res.file||S.cfg.file;
    S.cfg.dirty=false;
    S.cfg.saving=false;
    S.cfg.savedAt=new Date();
    var applied=Array.isArray(res.applied)?res.applied:[];
    var restart=Array.isArray(res.restartRequired)?res.restartRequired:[];
    var ignored=Array.isArray(res.ignored)?res.ignored:[];
    var msg='配置已保存 · '+applied.length+' 项立即生效';
    if(restart.length) msg+=' · 需重启：'+keyLabels(restart).join('、');
    if(ignored.length) msg+=' · 已忽略：'+keyLabels(ignored).join('、');
    toast(msg,restart.length?'warning':'success',restart.length?7200:4200);
    renderConfig();
  }catch(err){
    S.cfg.saving=false;
    setConfigControlsDisabled(false);
    cfgStatus();
    toast(friendlyError(err),'error',5400);
  }
}

/* ═══════════════════════ toast / modal ═══════════════════════ */
function toast(msg, type, ms){
  var box=$('#toasts');
  if(!box) return;
  while(box.children.length>=4) box.removeChild(box.firstElementChild);
  type=type||'info';
  var t=document.createElement('div');
  t.className='toast '+type;
  t.setAttribute('role',type==='error'?'alert':'status');
  t.setAttribute('aria-atomic','true');
  var ic={success:'check',error:'warn',warning:'warn',info:'info'}[type]||'info';
  t.innerHTML=icon(ic,'t-ic')+'<span class="t-msg">'+esc(msg)+'</span>'+
    '<button class="t-close" type="button" aria-label="关闭通知" title="关闭">'+icon('x')+'</button>';
  box.appendChild(t);
  var timer=null, started=0, remaining=ms||4000;
  function arm(wait){
    started=Date.now();
    clearTimeout(timer);
    timer=setTimeout(kill,Math.max(600,wait));
  }
  function pauseTimer(){
    if(t.dataset.dead) return;
    clearTimeout(timer);
    remaining=Math.max(600,remaining-(Date.now()-started));
  }
  function resumeTimer(){
    if(!t.dataset.dead) arm(remaining);
  }
  function kill(){
    if(t.dataset.dead) return;
    t.dataset.dead='1';
    clearTimeout(timer);
    t.classList.add('out');
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },230);
  }
  arm(remaining);
  t.addEventListener('mouseenter',pauseTimer);
  t.addEventListener('mouseleave',resumeTimer);
  t.addEventListener('focusin',pauseTimer);
  t.addEventListener('focusout',function(e){ if(!t.contains(e.relatedTarget)) resumeTimer(); });
  var close=$('.t-close',t);
  if(close) close.addEventListener('click',kill);
}

async function doCopy(what,label){
  if(what==='scope') { copyValue(S.detail.scope||'', label||'scope'); return; }
  if(what==='session') { copyValue(S.detail.data?S.detail.data.sessionId:'', label||'session id'); return; }
  copyValue(what,label||'内容');
}

/* ═══════════════════════ 事件 ═══════════════════════ */
document.addEventListener('click', async function(e){
  var el=e.target.closest('[data-action]');
  if(!el||el.disabled) return;
  var a=el.dataset.action;
  if(a==='nav'){
    var targetView=el.dataset.view;
    if(S.view==='config'&&S.cfg.dirty&&targetView!=='config'){
      confirmModal({
        title:'离开配置页？',
        text:'当前有未保存的配置更改。离开后这些更改会丢失，已保存的配置不受影响。',
        confirmLabel:'放弃更改并离开',
        danger:true,
        onConfirm:function(){ S.cfg.dirty=false; go(targetView); }
      });
      return;
    }
    go(targetView); return;
  }
  if(a==='ov-refresh'){ refreshOverview(true); return; }
  if(a==='se-refresh'){ refreshSessions(true); return; }
  if(a==='dt-refresh'){ refreshDetail(true); return; }
  if(a==='go-sessions'){ go('sessions'); return; }
  if(a==='go-detail'){ goDetail(el.dataset.scope); return; }
  if(a==='back'){ goBack(); return; }
  if(a==='busy-filter'){
    S.busyOnly=!S.busyOnly;
    var chip=$('[data-action="busy-filter"]');
    if(chip){ chip.classList.toggle('on',S.busyOnly); chip.setAttribute('aria-pressed',String(S.busyOnly)); }
    renderSessionsTable();
    return;
  }
  if(a==='clear-filter'){
    S.q=''; S.busyOnly=false;
    var search=$('#se-search');
    if(search){ search.value=''; search.focus(); }
    var chip2=$('[data-action="busy-filter"]');
    if(chip2){ chip2.classList.remove('on'); chip2.setAttribute('aria-pressed','false'); }
    renderSessionsTable();
    return;
  }
  if(a==='copy'){ doCopy(el.dataset.copy,el.dataset.label); return; }
  if(a==='copy-file'){ copyCurrentFile(el.dataset.file); return; }
  if(a==='tab'){ setTab(el.dataset.tab); return; }
  if(a==='seg'){ setTarget(el.dataset.target); return; }
  if(a==='send'){ doSend(); return; }
  if(a==='dt-reset'){ confirmReset(); return; }
  if(a==='dt-abort'){ confirmAbort(); return; }
  if(a==='dt-dream'){ confirmDream(); return; }
  if(a==='toggle-pass'){ togglePass(el.dataset.for); return; }
  if(a==='cfg-save'){ saveConfig(); return; }
  if(a==='cfg-format'){ formatJson(); return; }
  if(a==='cfg-advanced'){ toggleConfigAdvanced(); return; }
  if(a==='cfg-group'){ gotoConfigGroup(Number(el.dataset.index)); return; }
  if(a==='cfg-retry'){ loadConfig(); return; }
  if(a==='token'){ openTokenModal(); return; }
  if(a==='tok-cancel'){ closeModal(); return; }
  if(a==='tok-save'){ saveToken(); return; }
  if(a==='m-cancel'){ closeModal(); return; }
  if(a==='m-confirm'){
    var cb=confirmCb;
    closeModal();
    if(cb){ try{ cb(); }catch(err){ toast(friendlyError(err),'error',5000); } }
    return;
  }
});
function trapModalFocus(e){
  var nodes=modalFocusables();
  if(!nodes.length){ e.preventDefault(); return; }
  var first=nodes[0], last=nodes[nodes.length-1];
  var active=document.activeElement;
  var ov=$('#overlay');
  if(e.shiftKey){
    if(active===first||!ov.contains(active)){ e.preventDefault(); last.focus(); }
  }else{
    if(active===last||!ov.contains(active)){ e.preventDefault(); first.focus(); }
  }
}
document.addEventListener('keydown', function(e){
  var overlay=$('#overlay');
  if(overlay&&!overlay.hidden){
    if(e.key==='Escape'){ e.preventDefault(); closeModal(); return; }
    if(e.key==='Tab'){ trapModalFocus(e); return; }
    if(e.key==='Enter'&&e.target&&e.target.id==='tok-input'){ e.preventDefault(); saveToken(); return; }
    return;
  }
  if(e.key==='Escape') return;
  var tabEl=e.target&&e.target.closest?e.target.closest('.tab[role="tab"]'):null;
  if(tabEl&&['ArrowLeft','ArrowRight','Home','End'].indexOf(e.key)>-1){
    var tabs=$$('#view-detail .tab[role="tab"]');
    var idx=tabs.indexOf(tabEl);
    var next=idx;
    if(e.key==='ArrowLeft') next=(idx-1+tabs.length)%tabs.length;
    else if(e.key==='ArrowRight') next=(idx+1)%tabs.length;
    else if(e.key==='Home') next=0;
    else if(e.key==='End') next=tabs.length-1;
    if(tabs[next]){ e.preventDefault(); setTab(tabs[next].dataset.tab); tabs[next].focus(); }
    return;
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
    if(S.view==='sessions'){ e.preventDefault(); var search=$('#se-search'); if(search) search.focus(); }
    return;
  }
  if(e.key==='/'&&S.view==='sessions'){
    var a=document.activeElement;
    var inInput=a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'||a.isContentEditable);
    if(!inInput){ e.preventDefault(); var search2=$('#se-search'); if(search2) search2.focus(); }
    return;
  }
  if(e.target&&e.target.id==='send-input'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&!e.isComposing&&e.keyCode!==229){
    e.preventDefault(); doSend(); return;
  }
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.matches&&e.target.matches('[data-action][tabindex="0"]')&&e.target.tagName!=='BUTTON'){
    e.preventDefault(); e.target.click(); return;
  }
});
document.addEventListener('input', function(e){
  var t=e.target;
  if(!t) return;
  if(t.id==='se-search'){ S.q=t.value; renderSessionsTable(); return; }
  if(t.id==='send-input'){ clearTimeout(draftT); draftT=setTimeout(saveDraft,350); updateComposerUI(); return; }
  if(t.closest&&t.closest('#view-config')){
    if(S.cfg.saving) return;
    if(t.id==='cfg-json-ta'){
      var jsonErr=$('#cfg-json-err'); if(jsonErr){ jsonErr.hidden=true; jsonErr.textContent=''; }
      var jsonTa=$('#cfg-json-ta'); if(jsonTa) jsonTa.removeAttribute('aria-invalid');
    }else if(t.dataset&&t.dataset.key){
      var field=(S.cfg.fields||[]).filter(function(f){ return f.key===t.dataset.key; })[0];
      if(field) clearConfigError(field);
    }
    cfgStatus();
  }
});
document.addEventListener('change', function(e){
  var t=e.target;
  if(!t||S.cfg.saving) return;
  if(t.closest&&t.closest('#view-config')&&t.dataset&&t.dataset.key){
    var f=(S.cfg.fields||[]).filter(function(x){ return x.key===t.dataset.key; })[0];
    if(f&&f.type==='boolean'){
      var state=document.querySelector('[data-bool-for="'+f.__id+'"]');
      if(state) state.textContent=t.checked?'已启用':'已关闭';
    }
    if(f) clearConfigError(f);
    cfgStatus();
  }
});
document.addEventListener('focusout', function(e){
  var t=e.target;
  if(!t||S.cfg.saving||!t.closest||!t.closest('#cfg-form')||!t.dataset||!t.dataset.key) return;
  var f=(S.cfg.fields||[]).filter(function(x){ return x.key===t.dataset.key; })[0];
  if(f){ validateConfigField(f,true); cfgStatus(); }
});
$('#overlay').addEventListener('click', function(e){
  if(e.target.id==='overlay') closeModal();
});
window.addEventListener('beforeunload', saveDraft);

/* ═══════════════════════ 时钟 / 启动 ═══════════════════════ */
function startClock(){
  var el=$('#clock');
  if(!el) return;
  function f(){
    var now=new Date();
    el.textContent=fmtClock(now);
    el.title=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+fmtClock(now);
  }
  f();
  setInterval(f,1000);
}
async function boot(){
  startClock();
  try{
    var qtok=new URLSearchParams(location.search).get('token');
    if(qtok){ S.token=qtok; try{ localStorage.setItem(LS.token,qtok); }catch(_){}
      var qu=new URL(location.href); qu.searchParams.delete('token');
      history.replaceState(null,'',qu.pathname+qu.search+qu.hash);
    }
  }catch(_){}
  updateTokenIndicators();
  var forceDemo=new URLSearchParams(location.search).has('demo');
  var canProbe=location.protocol==='http:'||location.protocol==='https:';
  var real=false;
  if(!forceDemo&&canProbe){
    try{
      var headers={};
      if(S.token) headers['Authorization']='Bearer '+S.token;
      var res=await fetch('/api/status', {
        headers:headers,
        cache:'no-store',
        credentials:'same-origin',
        signal:(typeof AbortSignal!=='undefined'&&AbortSignal.timeout)?AbortSignal.timeout(2500):undefined
      });
      var probe=null;
      try{ probe=await res.json(); }catch(_){ probe=null; }
      if(res.status===401){
        real=true; S.lastRefreshOk=false;
        var reason=(probe&&probe.error)?String(probe.error):'接口要求面板 Token';
        if(!S.tokenPrompted){ S.tokenPrompted=true; openTokenModal(reason); }
      }else if(res.ok&&probe&&typeof probe==='object'){
        real=true;
      }
    }catch(_){ /* 接口不可用：进入演示模式，不中断预览 */ }
  }
  S.demo=!real;
  var dp=$('#demo-pill');
  if(dp) dp.hidden=!S.demo;
  updateApiDot();
  go('overview');
  setInterval(tick,5000);
}
boot();
