<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>DeepSleep 控制面板</title>
<meta name="description" content="QQ 群 AI 机器人本地控制面板：会话、任务、配置与运行状态。">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308090a'/%3E%3Crect x='6.5' y='9' width='19' height='15' rx='5' fill='none' stroke='%23f7f8f8' stroke-width='1.5'/%3E%3Cpath d='M11 14.5l2.5 2.2-2.5 2.2M16 18.9h5' fill='none' stroke='%23f7f8f8' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='9' r='1.6' fill='%235e6ad2'/%3E%3C/svg%3E">
<style>
/* ─────────────────────────────────────────────────────────────────────────
 * design-systems/linear-app/tokens.css
 *
 * Structured token bindings for the "Linear" brand — the dark-mode-native
 * project management tool's precision engineering voice.
 *
 * Brand identity in three sentences:
 *   1. Darkness as the native medium — near-black canvas (#08090a) where
 *      information density is managed through luminance steps rather than
 *      color variation; semi-transparent white borders throughout.
 *   2. Inter Variable with OpenType "cv01","ss03" at all sizes, signature
 *      weight 510 (between regular and medium), aggressive negative
 *      letter-spacing at display sizes (-1.584px at 72px).
 *   3. Almost entirely achromatic — the single chromatic color is Linear's
 *      indigo-violet (#5e6ad2 bg / #7170ff interactive), used only for
 *      CTAs and active states; everything else is grayscale.
 *
 * Schema decisions:
 *   - --bg: #08090a (marketing black); --surface: #191a1b (elevated).
 *   - --surface-warm aliases --surface (dark system, no warm tier).
 *   - --fg: #f7f8f8 (near-white — not pure white, prevents eye strain).
 *   - --fg-2: #d0d6e0 (silver-gray body text).
 *   - --border: rgba(255,255,255,0.08); --border-soft: rgba(255,255,255,0.05).
 *   - --accent: #5e6ad2 (brand indigo bg); --accent-hover: #828fff.
 *   - --tracking-display: -0.022em (-1.584px / 72px normalized).
 *   - --radius-sm: 6px (buttons/inputs); --radius-md: 8px (cards).
 *   - --elev-raised: luminance stepping — no opaque shadow on dark.
 * ─────────────────────────────────────────────────────────────────── */

:root {
  /* ─── Surface ──────────────────────────────────────────────────── */
  --bg:           #08090a;              /* marketing black — hero canvas */
  --surface:      #191a1b;              /* elevated surface — cards, dropdowns */
  --surface-warm: var(--surface);       /* no warm tier in dark achromatic system */

  /* ─── Foreground ───────────────────────────────────────────────── */
  --fg:   #f7f8f8;                      /* near-white primary text */
  --fg-2: #d0d6e0;                      /* silver-gray body / secondary text */
  --muted: #8a8f98;                     /* tertiary — placeholders, metadata */
  --meta:  #62666d;                     /* quaternary — timestamps, disabled */

  /* ─── Border ───────────────────────────────────────────────────── */
  --border:      rgba(255, 255, 255, 0.08);   /* standard semi-transparent white */
  --border-soft: rgba(255, 255, 255, 0.05);   /* ultra-subtle divider */

  /* ─── Accent ───────────────────────────────────────────────────── */
  --accent:        #5e6ad2;             /* brand indigo — CTA backgrounds */
  --accent-on:     #ffffff;
  --accent-hover:  #828fff;             /* lighter saturated hover */
  --accent-active: #4752c4;             /* darker pressed state */

  /* ─── Semantic ─────────────────────────────────────────────────── */
  --success: #27a644;                   /* Linear green */
  --warn:    #eab308;
  --danger:  #dc2626;

  /* ─── Typography ───────────────────────────────────────────────── */
  --font-display: "Inter Variable", "Inter", "SF Pro Display", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-body:    "Inter Variable", "Inter", "SF Pro Display", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-mono:    "Berkeley Mono", ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;

  /* Type scale — DESIGN.md §Typography Hierarchy.
   * Linear's display range 72px→10px; the 8 schema slots map the
   * key stops. 64px secondary-hero lives inline in components.html. */
  --text-xs:   12px;                    /* label / micro */
  --text-sm:   14px;                    /* caption large / link small */
  --text-base: 16px;                    /* body — standard reading */
  --text-lg:   18px;                    /* body large — feature descriptions */
  --text-xl:   24px;                    /* heading 2 */
  --text-2xl:  32px;                    /* heading 1 */
  --text-3xl:  48px;                    /* display — section headlines */
  --text-4xl:  72px;                    /* display XL — hero */

  /* Leading + tracking.
   * --leading-tight=1.00: Linear's signature "engineered" compression.
   * h2 (32px) → 1.13; h3 (24px) → 1.33 per DESIGN.md spec.
   * --tracking-display: -0.022em = -1.584px / 72px normalized. */
  --leading-body:     1.5;
  --leading-tight:    1.00;
  --tracking-display: -0.022em;

  /* ─── Spacing ──────────────────────────────────────────────────── */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;

  /* Section rhythm — DESIGN.md §Whitespace Philosophy. */
  --section-y-desktop: 80px;
  --section-y-tablet:  48px;
  --section-y-phone:   32px;

  /* ─── Radius ───────────────────────────────────────────────────── */
  /* 6px for buttons/inputs (comfortable), 8px cards, 12px panels. */
  --radius-sm:   6px;
  --radius-md:   8px;
  --radius-lg:   12px;
  --radius-pill: 9999px;

  /* ─── Elevation ────────────────────────────────────────────────── */
  /* On dark surfaces: luminance stepping, not opaque drop shadows.
     --elev-raised uses semi-transparent border-as-shadow technique. */
  --elev-flat:   none;
  --elev-ring:   0 0 0 1px var(--border);
  --elev-raised:
    rgba(0, 0, 0, 0.4) 0px 2px 4px,
    0 0 0 1px rgba(255, 255, 255, 0.05);

  /* ─── Focus ────────────────────────────────────────────────────── */
  /* Multi-layer stack per DESIGN.md §6 + §7: accent ring makes the
     indicator visible on the near-black #08090a canvas. */
  --focus-ring:
    0 0 0 2px color-mix(in oklab, var(--accent), transparent 30%),
    0 4px 12px rgba(0, 0, 0, 0.1);

  /* ─── Motion ───────────────────────────────────────────────────── */
  --motion-fast:   150ms;
  --motion-base:   200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);

  /* ─── Layout ───────────────────────────────────────────────────── */
  --container-max:            1200px;
  --container-gutter-desktop: 24px;
  --container-gutter-tablet:  16px;
  --container-gutter-phone:   12px;
}

/* ═══════════════════════════ base ═══════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--font-body),"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
  font-feature-settings:"cv01","ss03"}
h1,h2,h3{font-family:var(--font-display),"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif;letter-spacing:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}
::selection{background:color-mix(in oklab, var(--accent) 40%, transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
.skip-link{position:absolute;left:8px;top:-48px;z-index:100;padding:8px 14px;background:var(--accent);color:var(--accent-on);border-radius:var(--radius-sm);text-decoration:none;font-size:13px;transition:top var(--motion-fast) var(--ease-standard)}
.skip-link:focus-visible{top:8px}
.mono{font-family:var(--font-mono);font-size:12px}
.svg-i{width:15px;height:15px;flex:none}
.btn .svg-i{width:14px;height:14px}
.spin .svg-i{animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.hide-960{}

/* ═══════════════════════════ topbar ═══════════════════════════ */
.topbar{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--border-soft);
  background:color-mix(in oklab, var(--bg) 52%, var(--surface));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.topbar-inner{max-width:var(--container-max);margin:0 auto;display:flex;align-items:center;gap:16px;height:52px;padding:0 var(--container-gutter-desktop)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-name{font-size:14px;font-weight:590;white-space:nowrap}
.nav{display:flex;align-items:center;gap:2px}
.nav-item{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:var(--radius-sm);
  color:var(--muted);font-size:13px;font-weight:510;cursor:pointer;
  transition:background var(--motion-fast) var(--ease-standard),color var(--motion-fast) var(--ease-standard)}
.nav-item:hover{background:rgba(255,255,255,0.04);color:var(--fg-2)}
.nav-item.active{background:rgba(255,255,255,0.06);color:var(--fg)}
.nav-count{font-family:var(--font-mono);font-size:11px;color:var(--muted);background:rgba(255,255,255,0.07);border-radius:var(--radius-pill);padding:0 6px;line-height:16px;min-width:16px;text-align:center}
.topbar-spacer{flex:1}
.healths{display:flex;align-items:center;gap:14px}
.health{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:510;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--meta);flex:none}
.dot.ok{background:var(--success)}
.dot.err{background:var(--danger)}
.dot.warn{background:var(--warn)}
.dot.dim{background:var(--meta)}
.dot.breathe{animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.28}}
.clock{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border:1px solid var(--border);border-radius:var(--radius-pill);font-size:11px;font-weight:510;color:var(--fg-2);white-space:nowrap}
.pill .dot{width:6px;height:6px}
.pill.warn-tint{border-color:color-mix(in oklab, var(--warn) 35%, transparent);color:color-mix(in oklab, var(--warn) 75%, var(--fg));background:color-mix(in oklab, var(--warn) 8%, transparent)}
.pill.s{height:20px;padding:0 8px;font-size:11px}
.pill.s .dot{width:6px;height:6px}

/* ═══════════════════════════ layout / views ═══════════════════════════ */
main{max-width:var(--container-max);margin:0 auto;padding:26px var(--container-gutter-desktop) 72px;min-height:calc(100dvh - 52px)}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.view-title{font-size:21px;font-weight:590;line-height:1.4;margin:0}
.view-sub{font-size:12px;color:var(--muted);margin:4px 0 0}
.foot-note{font-size:12px;color:var(--muted);margin:12px 2px 0}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ═══════════════════════════ buttons ═══════════════════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:rgba(255,255,255,0.02);color:var(--fg-2);
  font-size:13px;font-weight:510;cursor:pointer;white-space:nowrap;
  transition:background var(--motion-fast) var(--ease-standard),border-color var(--motion-fast) var(--ease-standard),color var(--motion-fast) var(--ease-standard),transform var(--motion-fast) var(--ease-standard)}
.btn:hover{background:rgba(255,255,255,0.05);color:var(--fg)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.btn-primary{background:var(--accent);border-color:transparent;color:var(--accent-on);font-weight:590}
.btn-primary:hover{background:var(--accent-hover);color:var(--accent-on)}
.btn-primary:active{background:var(--accent-active);transform:translateY(1px)}
.btn-danger{border-color:color-mix(in oklab, var(--danger) 35%, transparent);color:color-mix(in oklab, var(--danger) 30%, var(--fg))}
.btn-danger:hover{background:color-mix(in oklab, var(--danger) 12%, transparent);color:color-mix(in oklab, var(--danger) 18%, var(--fg))}
.btn-danger-solid{background:var(--danger);border-color:transparent;color:var(--accent-on);font-weight:590}
.btn-danger-solid:hover{filter:brightness(1.12)}
.btn-danger-solid:active{filter:brightness(.92);transform:translateY(1px)}
.btn-icon{width:32px;padding:0}
.btn-sm{height:28px;padding:0 10px;font-size:12.5px}
.link{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:0;font-size:12.5px;font-weight:510;cursor:pointer;
  color:color-mix(in oklab, var(--accent) 45%, var(--fg));
  transition:color var(--motion-fast) var(--ease-standard)}
.link:hover{color:var(--accent-hover)}
.link-chev{width:13px;height:13px}
.copy-link{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:0;border-radius:4px;background:none;color:var(--meta);cursor:pointer;padding:0;vertical-align:-4px;
  transition:color var(--motion-fast) var(--ease-standard),background var(--motion-fast) var(--ease-standard)}
.copy-link:hover{color:var(--fg-2);background:rgba(255,255,255,0.06)}
.copy-link .svg-i{width:12px;height:12px}

/* ═══════════════════════════ chips / kv / panel ═══════════════════════════ */
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border:1px solid var(--border-soft);border-radius:4px;
  background:rgba(255,255,255,0.03);font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap;max-width:100%}
.chip.copy{cursor:pointer;transition:color var(--motion-fast) var(--ease-standard),background var(--motion-fast) var(--ease-standard),border-color var(--motion-fast) var(--ease-standard)}
.chip.copy:hover{color:var(--fg-2);background:rgba(255,255,255,0.06);border-color:var(--border)}
.panel{background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:var(--radius-md);min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border-soft)}
.panel-title{font-size:12.5px;font-weight:590;color:var(--fg-2);letter-spacing:0.02em;display:flex;align-items:center;gap:8px}
.panel-body{padding:16px}
.panel-body.pad0{padding:0}
.panel-foot{padding:11px 16px 0;border-top:1px solid var(--border-soft);margin-top:14px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.count-badge{font-family:var(--font-mono);font-size:11px;color:var(--muted);border:1px solid var(--border-soft);border-radius:var(--radius-pill);padding:0 6px;line-height:15px;font-variant-numeric:tabular-nums}
.count-badge.warn{color:var(--warn);border-color:color-mix(in oklab, var(--warn) 30%, transparent)}
.kv-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 16px;border-bottom:1px solid var(--border-soft);min-width:0}
.kv-row:last-child{border-bottom:0}
.kv-label{font-size:12.5px;color:var(--muted);white-space:nowrap;flex:none}
.kv-value{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg-2);min-width:0;overflow:hidden}
.kv-value .dot{width:7px;height:7px}
.kv-sub{font-size:11.5px;color:var(--muted)}
.kv-mono{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}

/* ═══════════════════════════ overview ═══════════════════════════ */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.stat{background:rgba(255,255,255,0.02);border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:13px 16px;min-width:0}
.stat-label{font-size:12px;color:var(--muted);font-weight:510}
.stat-value{font-size:26px;font-weight:590;line-height:1.25;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.stat-value.warn{color:var(--warn)}
.stat-value.err{color:color-mix(in oklab, var(--danger) 35%, var(--fg))}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.bar{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,0.05);margin-bottom:16px}
.bar-seg{height:100%;border-radius:2px;min-width:0}
.bar-seg.done{background:var(--success)}
.bar-seg.running{background:var(--warn)}
.bar-seg.queued{background:rgba(255,255,255,0.2)}
.bar-seg.error{background:var(--danger)}
.legend-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:5px 0}
.l-label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-2)}
.l-label .dot{width:8px;height:8px}
.l-num{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ═══════════════════════════ table ═══════════════════════════ */
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:590;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--border-soft);letter-spacing:0.04em;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle;font-size:13px;color:var(--fg-2)}
.tbl tbody tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:rgba(255,255,255,0.03)}
tr.clickable:focus-visible{box-shadow:inset 0 0 0 2px color-mix(in oklab, var(--accent) 50%, transparent)}
tr.clickable:focus-visible td{background:rgba(255,255,255,0.04)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cell-title{font-size:13px;color:var(--fg-2);margin-left:8px}
tr.clickable:hover .cell-title{color:var(--fg)}
.cell-sub{font-size:11px;color:var(--muted);margin-top:3px}
td.num{font-variant-numeric:tabular-nums}
.pending{font-variant-numeric:tabular-nums;font-size:13px}
.pending.has{color:var(--warn);font-weight:590;display:inline-flex;align-items:center;gap:6px}
.pending.has::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
.lm-time{margin-right:8px;color:var(--muted);font-size:11.5px}
.lm-who{margin-right:8px;color:var(--muted)}
.lm-text{color:var(--muted)}
.muted-dash{color:var(--meta)}
.search{position:relative;display:flex;align-items:center}
.search .svg-i{position:absolute;left:10px;color:var(--muted);pointer-events:none;width:14px;height:14px}
.search .input{padding-left:32px;width:250px}
.search kbd{position:absolute;right:9px;pointer-events:none}
.filter-chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-pill);
  background:rgba(255,255,255,0.02);color:var(--muted);font-size:12.5px;font-weight:510;cursor:pointer;
  transition:background var(--motion-fast) var(--ease-standard),color var(--motion-fast) var(--ease-standard),border-color var(--motion-fast) var(--ease-standard)}
.filter-chip .dot{width:6px;height:6px;background:var(--warn);opacity:.85}
.filter-chip:hover{color:var(--fg-2);background:rgba(255,255,255,0.04)}
.filter-chip.on{color:var(--fg);border-color:color-mix(in oklab, var(--accent) 45%, transparent);background:color-mix(in oklab, var(--accent) 12%, transparent)}

/* ═══════════════════════════ empty / skeleton ═══════════════════════════ */
.empty-state{display:flex;flex-direction:column;align-items:center;gap:6px;padding:44px 16px;text-align:center}
.empty-ic{width:20px;height:20px;color:var(--meta);margin-bottom:4px}
.empty-title{font-size:14px;font-weight:590;color:var(--fg-2)}
.empty-text{font-size:12.5px;color:var(--muted);max-width:46ch;line-height:1.7}
.empty-state .btn{margin-top:10px}
.empty-note{padding:18px 16px;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.7}
.ov-empty{margin-top:40px}
.sk{border-radius:4px;background:linear-gradient(100deg, rgba(255,255,255,0.045) 30%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.045) 70%);background-size:200% 100%;animation:skMove 1.3s linear infinite}
@keyframes skMove{to{background-position:-200% 0}}
.sk-row td{padding:13px 12px}

/* ═══════════════════════════ detail ═══════════════════════════ */
.detail-head{margin-bottom:16px}
.detail-left{display:flex;align-items:flex-start;gap:14px;min-width:0;flex-wrap:wrap}
.detail-title-block{min-width:0;flex:1}
.detail-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.detail-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}

.view-sub .mono{font-size:10px;color:var(--fg-2);min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view-sub .sep{font-family:var(--font-mono);font-size:9px;color:var(--meta)}
.view-head{margin-bottom:19px;gap:14px}
.view-head .toolbar{gap:8px}
.view-title:focus{outline:none}
.foot-note{font-size:10.5px;color:var(--meta);margin-top:10px}

/* ── shared polish ──────────────────────────────────────────────── */
.panel{border-color:var(--border-soft);background:color-mix(in oklab,var(--fg) 2%,var(--bg))}
.panel-head{padding:12px 16px;border-bottom-color:var(--border-soft)}
.panel-title{font-size:11.5px;line-height:1.45;font-weight:590;color:var(--fg-2);letter-spacing:.015em}
.panel-sub{font-size:10px;line-height:1.5;color:var(--meta);margin-top:1px}
.count-badge{font-size:9.5px;line-height:14px;padding:0 5px;color:var(--meta);border-color:var(--border-soft)}
.count-badge.warn{color:color-mix(in oklab,var(--warn) 65%,var(--fg));border-color:color-mix(in oklab,var(--warn) 24%,transparent)}
.pill{font-size:10.5px;font-weight:510;color:var(--muted);border-color:var(--border-soft);background:color-mix(in oklab,var(--fg) 2%,transparent)}
.pill.s{height:20px;font-size:10px;padding:0 7px}
.pill.warn-tint{background:color-mix(in oklab,var(--warn) 8%,transparent);border-color:color-mix(in oklab,var(--warn) 24%,transparent);color:color-mix(in oklab,var(--warn) 68%,var(--fg))}
.dot{width:6px;height:6px}
.dot.live{background:var(--fg);animation:breathe 2.2s ease-in-out infinite}
.chip{font-size:9.5px;line-height:18px;border-color:var(--border-soft);background:color-mix(in oklab,var(--fg) 2.5%,transparent);color:var(--muted);border-radius:4px}
.mono{font-size:10.5px}
.link{font-size:11px;color:var(--fg-2);padding:3px 1px;border-radius:3px}
.link:hover{color:var(--fg)}
.link .link-chev{transition:transform var(--motion-fast) var(--ease-standard)}
.link:hover .link-chev{transform:translateX(1px)}
.btn{font-size:12.5px}
.btn-primary:hover{background:color-mix(in oklab,var(--accent),var(--bg) 18%);border-color:color-mix(in oklab,var(--accent),var(--bg) 18%);color:var(--accent-on)}
.btn-primary:active{background:color-mix(in oklab,var(--accent),var(--bg) 30%);border-color:color-mix(in oklab,var(--accent),var(--bg) 30%)}
.btn:disabled{opacity:1;color:var(--meta);border-color:var(--border-soft);background:color-mix(in oklab,var(--fg) 2%,transparent)}
.btn-primary:disabled{color:var(--muted);background:color-mix(in oklab,var(--accent),var(--bg) 64%);border-color:transparent}
.btn-danger{border-color:color-mix(in oklab,var(--danger) 22%,transparent);color:color-mix(in oklab,var(--danger) 25%,var(--fg));background:transparent}
.btn-danger:hover{background:color-mix(in oklab,var(--danger) 9%,transparent);border-color:color-mix(in oklab,var(--danger) 34%,transparent);color:color-mix(in oklab,var(--danger) 18%,var(--fg))}
.btn-danger-solid{background:color-mix(in oklab,var(--danger),var(--bg) 12%);border-color:transparent;color:var(--accent-on)}
.btn-danger-solid:hover{background:color-mix(in oklab,var(--danger),var(--bg) 20%);filter:none}
.btn-icon{width:32px;height:32px;padding:0}
.btn-sm{height:28px;padding:0 9px;font-size:11.5px}
.input{height:34px;border-color:var(--border);background:color-mix(in oklab,var(--fg) 2%,var(--bg));font-size:12.5px;color:var(--fg)}
.input::placeholder{color:var(--muted)}
.input:hover{border-color:color-mix(in oklab,var(--fg) 16%,transparent)}
.input:focus,.input:focus-visible{outline:none;border-color:var(--accent-hover);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 18%,transparent)}
.input.invalid{border-color:color-mix(in oklab,var(--danger) 62%,transparent);box-shadow:0 0 0 3px color-mix(in oklab,var(--danger) 11%,transparent)}
textarea.input{line-height:1.7}
.field-help{font-size:10.5px;line-height:1.65;color:var(--muted);max-width:52ch}
.field-error{font-size:10.5px;line-height:1.6;color:color-mix(in oklab,var(--danger) 22%,var(--fg))}
.field label{font-size:11.5px;line-height:1.5}
.switch-label{font-size:11px;color:var(--muted)}
kbd{font-size:9px;line-height:1.55;border-color:var(--border-soft);border-bottom-width:1px;background:color-mix(in oklab,var(--fg) 3%,transparent);color:var(--muted);min-width:17px;text-align:center}
:where(button,a,input,textarea,select,summary,[tabindex]):focus-visible{outline:2px solid var(--accent-hover);outline-offset:2px;box-shadow:var(--focus-ring)}
.input:focus-visible{box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 18%,transparent)}
.tbl tbody tr.clickable:focus-visible{outline-offset:-2px}
.sk-title{width:104px;height:25px;border-radius:5px}
.sk-subtitle{width:238px;height:9px;margin-top:9px;border-radius:3px}

/* ── overview ───────────────────────────────────────────────────── */
.dash-grid{
  display:grid;grid-template-columns:minmax(0,1.62fr) minmax(306px,1fr);
  grid-template-areas:"bot counts" "recent facts";gap:16px;align-items:stretch;
}
.dash-bot{grid-area:bot;display:flex;flex-direction:column}
.dash-counts{grid-area:counts;display:flex;flex-direction:column}
.dash-recent{grid-area:recent;display:flex;flex-direction:column;min-width:0}
.dash-facts{grid-area:facts;display:flex;flex-direction:column}
.attention{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-height:38px;
  margin-bottom:16px;padding:8px 11px;border:1px solid color-mix(in oklab,var(--warn) 20%,transparent);
  border-radius:var(--radius-md);background:color-mix(in oklab,var(--warn) 5%,transparent);
  color:var(--fg-2);font-size:11px;line-height:1.55;
}
.attention.danger{border-color:color-mix(in oklab,var(--danger) 19%,transparent);background:color-mix(in oklab,var(--danger) 5%,transparent)}
.attention-icon{width:20px;height:20px;flex:none;display:grid;place-items:center;border-radius:4px;color:color-mix(in oklab,var(--warn) 70%,var(--fg));background:color-mix(in oklab,var(--warn) 8%,transparent)}
.attention.danger .attention-icon{color:color-mix(in oklab,var(--danger) 30%,var(--fg));background:color-mix(in oklab,var(--danger) 8%,transparent)}
.attention .svg-i{width:12px;height:12px}
.attention-copy{display:flex;align-items:center;gap:4px 9px;flex-wrap:wrap;min-width:0}
.attention-title{font-weight:590;color:var(--fg-2);white-space:nowrap}
.attention-items{display:flex;align-items:center;flex-wrap:wrap;gap:3px 8px;color:var(--muted);font-size:10.5px}
.attention-items .item{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.attention-items .item::before{content:"";width:3px;height:3px;border-radius:50%;background:var(--meta);flex:none}
.attention.danger .attention-items .item::before{background:color-mix(in oklab,var(--danger) 55%,transparent)}
.attention-action{margin-left:auto;flex:none;color:color-mix(in oklab,var(--warn) 55%,var(--fg));font-size:10.5px}
.attention.danger .attention-action{color:color-mix(in oklab,var(--danger) 28%,var(--fg))}
.attention-action:hover{color:var(--fg);background:color-mix(in oklab,var(--fg) 5%,transparent)}
.bot-ident{display:flex;align-items:flex-start;gap:11px;padding:16px 16px 14px;min-width:0}
.bot-avatar{
  width:38px;height:38px;flex:none;display:grid;place-items:center;border:1px solid var(--border);
  border-radius:9px;background:color-mix(in oklab,var(--fg) 4%,transparent);color:var(--fg);
  box-shadow:inset 0 1px 0 color-mix(in oklab,var(--fg) 6%,transparent);
}
.bot-copy{min-width:0;flex:1}
.bot-title-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.bot-name{font-size:18px;line-height:1.35;font-weight:590;color:var(--fg);letter-spacing:0;overflow-wrap:anywhere}
.bot-mode{height:19px;padding:0 6px;font-size:9px;line-height:1;border-color:var(--border-soft);color:var(--muted);background:color-mix(in oklab,var(--fg) 3%,transparent)}
.bot-product{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-family:var(--font-mono);font-size:9px;line-height:1.5;color:var(--meta);margin-top:3px}
.bot-product .slash{color:var(--border)}
.bot-uptime{margin-left:auto;padding-left:14px;flex:none;text-align:right}
.bot-uptime span{display:block;font-family:var(--font-mono);font-size:8.5px;line-height:1.45;color:var(--meta)}
.bot-uptime strong{display:block;font-size:10.5px;line-height:1.5;font-weight:510;color:var(--fg-2);font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.service-list{padding:0 8px 8px;margin-top:auto}
.service-row{
  display:grid;grid-template-columns:8px minmax(118px,.9fr) minmax(0,1.25fr) auto;align-items:center;gap:9px;
  min-height:49px;padding:7px 8px;border-top:1px solid var(--border-soft);border-radius:5px;
  transition:background var(--motion-fast) var(--ease-standard);
}
.service-row:hover{background:color-mix(in oklab,var(--fg) 3%,transparent)}
.service-row .dot{width:5px;height:5px}
.svc-main{min-width:0;display:flex;flex-direction:column;gap:1px}
.svc-name{font-size:11.5px;line-height:1.45;font-weight:510;color:var(--fg-2);white-space:nowrap}
.svc-desc{font-size:9.5px;line-height:1.45;color:var(--meta);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svc-endpoint{font-family:var(--font-mono);font-size:8.5px;line-height:1.5;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.svc-state{display:inline-flex;align-items:center;justify-content:flex-end;gap:5px;font-size:9.5px;line-height:1.35;color:var(--muted);white-space:nowrap}
.svc-state.ok{color:color-mix(in oklab,var(--success) 50%,var(--fg))}
.svc-state.err{color:color-mix(in oklab,var(--danger) 24%,var(--fg))}
.svc-state.warn{color:color-mix(in oklab,var(--warn) 58%,var(--fg))}
.dash-counts .panel-head{padding-bottom:9px}
.count-headline{display:flex;align-items:flex-end;gap:7px;padding:1px 16px 8px;min-width:0}
.count-total{font-size:31px;line-height:1.08;font-weight:590;letter-spacing:-.02em;color:var(--fg);font-variant-numeric:tabular-nums}
.count-total-label{padding-bottom:3px;font-size:10px;line-height:1.4;color:var(--muted)}
.count-sync{margin-left:auto;padding-bottom:3px;font-family:var(--font-mono);font-size:8.5px;color:var(--meta);white-space:nowrap}
.counts-body{padding:0 16px 15px;display:flex;flex-direction:column;flex:1}
.dash-counts .bar{margin:0 0 11px;height:6px;background:color-mix(in oklab,var(--fg) 5%,transparent)}
.bar-seg{border-radius:1.5px}
.bar-seg.done{background:color-mix(in oklab,var(--fg) 63%,var(--bg))}
.bar-seg.running{background:var(--fg)}
.bar-seg.queued{background:color-mix(in oklab,var(--fg) 24%,var(--bg))}
.bar-seg.error{background:var(--danger)}
.count-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border-soft);border-radius:5px;overflow:hidden;background:color-mix(in oklab,var(--fg) 1.2%,transparent)}
.count-cell{display:flex;align-items:center;gap:7px;min-height:36px;padding:7px 9px;font-size:10.5px;color:var(--muted)}
.count-cell:nth-child(odd){border-right:1px solid var(--border-soft)}
.count-cell:nth-child(-n+2){border-bottom:1px solid var(--border-soft)}
.count-cell .dot{width:5px;height:5px}
.count-cell-value{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.count-cell.is-error .count-cell-value{color:color-mix(in oklab,var(--danger) 25%,var(--fg))}
.session-split{display:grid;grid-template-columns:1fr 1fr;margin-top:auto;padding-top:12px;border-top:1px solid var(--border-soft);gap:12px}
.split-stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.split-stat+.split-stat{border-left:1px solid var(--border-soft);padding-left:12px}
.split-label{font-size:9.5px;line-height:1.4;color:var(--meta)}
.split-value{font-size:18px;line-height:1.3;font-weight:510;color:var(--fg);font-variant-numeric:tabular-nums}
.split-value.warn{color:color-mix(in oklab,var(--warn) 66%,var(--fg))}
.recent-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border-soft)}
.recent-panel-head .left{display:flex;align-items:center;gap:8px;min-width:0}
.recent-panel-head .count{font-family:var(--font-mono);font-size:10px;font-weight:400;color:var(--muted);background:color-mix(in oklab,var(--fg) 5%,transparent);border-radius:4px;padding:1px 5px}
.recent-list{padding:2px 7px 7px}
.overview-session{
  appearance:none;width:100%;display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:9px;align-items:center;
  padding:9px 9px;border:1px solid transparent;border-radius:5px;text-align:left;color:var(--fg-2);
  transition:background var(--motion-fast) var(--ease-standard),border-color var(--motion-fast) var(--ease-standard);
}
.overview-session:hover{background:color-mix(in oklab,var(--fg) 3.2%,transparent);border-color:var(--border-soft)}
.overview-session .dot{width:5px;height:5px;align-self:start;margin-top:7px}
.os-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.os-top{display:flex;align-items:center;gap:7px;min-width:0}
.os-title{font-size:11.5px;line-height:1.5;font-weight:510;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.overview-session:hover .os-title{color:var(--fg)}
.os-busy{font-family:var(--font-mono);font-size:8.5px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.os-busy .dot{width:4px;height:4px;margin:0;align-self:center}
.os-meta{display:flex;align-items:center;gap:5px;min-width:0;font-family:var(--font-mono);font-size:8.5px;line-height:1.5;color:var(--meta)}
.os-meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.os-meta .dot-sep{flex:none}
.os-preview{font-size:10px;line-height:1.6;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;margin-top:1px}
.os-right{display:flex;align-items:center;gap:7px;padding-left:4px;flex:none}
.os-time{font-family:var(--font-mono);font-size:8.5px;color:var(--meta);white-space:nowrap}
.os-pending{font-family:var(--font-mono);font-size:8.5px;line-height:16px;min-width:16px;text-align:center;padding:0 4px;border-radius:3px;color:color-mix(in oklab,var(--warn) 68%,var(--fg));background:color-mix(in oklab,var(--warn) 8%,transparent);border:1px solid color-mix(in oklab,var(--warn) 19%,transparent)}
.os-arrow{color:var(--meta);display:flex;transition:transform var(--motion-fast) var(--ease-standard),color var(--motion-fast) var(--ease-standard)}
.os-arrow .svg-i{width:12px;height:12px}
.overview-session:hover .os-arrow{transform:translateX(1px);color:var(--fg-2)}
.recent-empty{padding:28px 16px 32px}
.facts-body{padding:2px 16px 0;display:flex;flex-direction:column;flex:1}
.fact-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-soft);min-width:0}
.fact-label{font-size:9.5px;line-height:1.5;color:var(--meta);flex:none;white-space:nowrap}
.fact-value{display:inline-flex;align-items:center;gap:4px;min-width:0;font-family:var(--font-mono);font-size:9px;line-height:1.5;color:var(--fg-2);text-align:right}
.fact-value code,.fact-value .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:220px;font:inherit}
.fact-value .muted{color:var(--muted)}
.fact-row .copy-link{flex:none;width:18px;height:18px}
.fact-row .copy-link .svg-i{width:11px;height:11px}
.facts-foot{margin-top:auto;padding:10px 16px;border-top:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--font-mono);font-size:8.5px;line-height:1.5;color:var(--meta);white-space:nowrap}
.facts-foot .left{display:inline-flex;align-items:center;gap:5px;min-width:0}
.facts-foot .dot{width:4px;height:4px}
.uptime-value-note{display:block;font-family:var(--font-body);font-size:9px;color:var(--meta);margin-top:1px;white-space:nowrap}

/* ── session table ──────────────────────────────────────────────── */
.view .toolbar .search .input{height:32px;border-color:var(--border);background:color-mix(in oklab,var(--fg) 2%,var(--bg));font-size:12px}
.search .input::-webkit-search-cancel-button{-webkit-appearance:none}
.search{min-width:180px}
.search .input{width:268px}
.search .svg-i{width:13px;height:13px;color:var(--meta)}
.search kbd{right:7px;color:var(--meta);font-size:8.5px;border-color:var(--border-soft)}
.filter-chip{height:31px;font-size:11.5px;border-color:var(--border);color:var(--muted);background:color-mix(in oklab,var(--fg) 1.8%,var(--bg))}
.filter-chip:hover{color:var(--fg-2);background:color-mix(in oklab,var(--fg) 4%,transparent)}
.filter-chip.on{color:var(--fg);border-color:color-mix(in oklab,var(--accent) 38%,transparent);background:color-mix(in oklab,var(--accent) 11%,transparent)}
.filter-chip .dot{width:5px;height:5px;background:var(--meta)}
.filter-chip.on .dot{background:var(--accent-hover)}
.tbl{border-collapse:separate;border-spacing:0;table-layout:fixed}
.tbl th{font-size:9.5px;font-weight:510;color:var(--meta);letter-spacing:.02em;padding:9px 12px;background:color-mix(in oklab,var(--fg) 1%,transparent)}
.tbl th:first-child{padding-left:16px}
.tbl td{padding:9px 12px;font-size:11.5px;color:var(--fg-2);border-bottom-color:var(--border-soft);background:transparent}
.tbl td:first-child{padding-left:16px}
.tbl th:last-child,.tbl td:last-child{padding-right:16px}
tr.clickable td{transition:background var(--motion-fast) var(--ease-standard)}
tr.clickable:hover td{background:color-mix(in oklab,var(--fg) 3.2%,transparent)}
tr.clickable:focus-visible td{background:color-mix(in oklab,var(--fg) 4%,transparent)}
.cell-title{font-size:11.5px;font-weight:510;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;display:block}
.cell-title-btn{display:block;width:100%;min-width:0;padding:0;border:0;border-radius:3px;background:transparent;text-align:left;color:inherit;cursor:pointer}
.cell-title-btn:hover .cell-title{color:var(--fg)}
.cell-title-btn:focus-visible{outline-offset:-2px}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td.r .pending{display:inline-block}
.session-title-line{display:flex;align-items:center;gap:6px;min-width:0}
tr.clickable:hover .cell-title{color:var(--fg)}
.cell-sub{margin-top:2px}
.session-ident-line{display:flex;align-items:center;gap:5px;min-width:0;font-family:var(--font-mono);font-size:8.5px;line-height:1.5;color:var(--meta);overflow:hidden}
.session-ident-line .scope{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-ident-line .sid{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);opacity:.85;min-width:40px}
.session-ident-line .sep{flex:none;color:var(--border)}
tr.clickable .session-ident-line .scope{color:var(--muted)}
.pill .dot{width:5px;height:5px}
.pending{font-family:var(--font-mono);font-size:10px}
.pending.has{font-family:var(--font-mono);font-size:9px;gap:4px;color:color-mix(in oklab,var(--warn) 68%,var(--fg));padding:1px 5px;border:1px solid color-mix(in oklab,var(--warn) 18%,transparent);border-radius:3px;background:color-mix(in oklab,var(--warn) 7%,transparent)}
.pending.has::before{width:4px;height:4px}
.lm-time{font-size:9px;color:var(--meta);margin-right:6px}
.lm-who{font-size:10px;color:var(--muted);margin-right:6px}
.lm-text{font-size:10.5px;color:var(--meta)}
tr.clickable:hover .lm-text{color:var(--muted)}
.empty-state{padding:42px 20px;gap:5px}
.empty-title{font-size:12.5px;font-weight:510;color:var(--fg-2)}
.empty-text{font-size:10.5px;color:var(--muted);line-height:1.7}
.empty-ic{width:18px;height:18px;color:var(--meta)}
.sessions-error{padding:34px 20px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:520px}
.table-message{display:flex;align-items:flex-start;gap:8px;padding:9px 16px;border-bottom:1px solid var(--border-soft);font-size:10.5px;line-height:1.55;color:color-mix(in oklab,var(--danger) 18%,var(--muted));background:color-mix(in oklab,var(--danger) 5%,transparent)}
.table-message .svg-i{width:13px;height:13px;color:color-mix(in oklab,var(--danger) 42%,var(--fg));flex:none;margin-top:1px}
.table-message .link{margin-left:auto}
.sk-row td{padding:12px 16px}
.sess-pending-label{display:none}

/* ── detail ─────────────────────────────────────────────────────── */
.detail-head{align-items:flex-start}
.detail-left{gap:11px;align-items:flex-start}
.detail-title-block{min-width:0;flex:1}
.detail-title-row{gap:8px}
.detail-title-row .chip{flex:none}
.view-title#dt-title{max-width:760px}
.detail-meta{gap:5px 7px;margin-top:6px;font-size:10px;color:var(--meta);min-width:0}
.detail-meta .mono{font-size:9px;color:var(--muted)}
.detail-meta .sep{color:var(--border);font-size:8px}
.detail-meta .meta-workspace{max-width:min(38vw,360px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
.detail-actions{gap:6px;flex:none}
.detail-actions .btn{height:30px;font-size:11px}
.detail-actions .btn .mono{font-size:9px;color:var(--meta);margin-right:1px}
.detail-actions .btn-danger .mono{color:color-mix(in oklab,var(--danger) 28%,var(--fg))}
.detail-actions .btn-danger:hover .mono{color:color-mix(in oklab,var(--danger) 16%,var(--fg))}
.detail-actions .btn.btn-refresh{width:30px;padding:0;flex:none}
.sendbox{padding:10px 11px;gap:8px;background:color-mix(in oklab,var(--fg) 1.6%,var(--bg));border-color:var(--border-soft);border-radius:var(--radius-md);margin-bottom:16px}
.sendbox-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg{padding:2px;gap:2px;border-color:var(--border-soft);background:color-mix(in oklab,var(--fg) 3%,transparent);border-radius:5px}
.seg button{height:25px;padding:0 9px;font-size:10.5px;border-radius:4px;color:var(--muted)}
.seg button:hover{color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:color-mix(in oklab,var(--fg) 7%,var(--bg));color:var(--fg);box-shadow:0 0 0 1px var(--border-soft)}
.send-target-note{font-size:9px;line-height:1.5;color:var(--meta);text-align:right;min-width:0}
#send-input{min-height:72px;max-height:180px;padding:9px 11px;border-color:var(--border-soft);background:color-mix(in oklab,var(--bg) 68%,transparent);font-size:12.5px;resize:vertical}
#send-input:focus{border-color:color-mix(in oklab,var(--accent) 55%,transparent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 12%,transparent)}
.sendbox-foot{gap:10px;flex-wrap:wrap}
.hint{font-size:9.5px;line-height:1.5;color:var(--meta)}
.hint kbd{font-size:8px;min-width:16px}
.send-btn{height:30px;font-size:11.5px;padding:0 12px}
.send-btn[aria-busy="true"]{opacity:1}
.detail-grid{grid-template-columns:minmax(0,1fr) 316px;gap:16px}
.detail-main{gap:0}
.conv-wrap{border-color:var(--border-soft);background:color-mix(in oklab,var(--fg) 1.6%,var(--bg))}
.tabs{padding:0 8px;min-height:40px;gap:1px}
.tab{height:40px;padding:0 9px;font-size:11px;gap:5px;border-bottom-width:2px}
.tab:hover{color:var(--fg-2)}
.tab.active{color:var(--fg);border-bottom-color:var(--accent)}
.tab .count{font-size:9px;line-height:15px;background:color-mix(in oklab,var(--fg) 5%,transparent);color:var(--muted);padding:0 5px}
.tab.active .count{color:var(--fg-2);background:color-mix(in oklab,var(--fg) 8%,transparent)}
.tab:focus-visible{outline-offset:-2px;box-shadow:inset 0 0 0 2px color-mix(in oklab,var(--accent) 45%,transparent)}
.conv{height:clamp(340px,calc(100dvh - 400px),620px);padding:16px 16px 19px;gap:13px}
.msg{max-width:84%}
.msg-meta{gap:6px;font-size:9px;color:var(--meta);margin-bottom:4px}
.msg-meta .m-role{color:var(--muted);font-weight:510}
.msg-meta .mono{font-size:8.5px}
.msg-meta .m-time{color:var(--meta)}
.msg-meta .m-model{color:var(--meta);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-meta .m-synthetic{font-size:8px;color:var(--meta);border:1px solid var(--border-soft);border-radius:3px;padding:0 3px}
.bubble{padding:9px 12px;border-color:var(--border-soft);background:color-mix(in oklab,var(--fg) 2.6%,transparent);color:var(--fg-2);font-size:12.5px;line-height:1.75;border-radius:var(--radius-md)}
.msg.assistant .bubble{background:color-mix(in oklab,var(--surface) 38%,var(--bg));border-color:var(--border)}
.msg.user .bubble{background:color-mix(in oklab,var(--fg) 2.5%,transparent)}
.bubble.rich{white-space:normal}
.bubble.rich strong{font-weight:590;color:var(--fg)}
.bubble.rich code{font-family:var(--font-mono);font-size:10.5px;color:var(--fg);background:color-mix(in oklab,var(--fg) 5%,transparent);border:1px solid var(--border-soft);border-radius:3px;padding:1px 4px}
.bubble.rich pre{margin:8px 0 2px;padding:9px 10px;border:1px solid var(--border-soft);border-radius:5px;background:color-mix(in oklab,var(--bg) 76%,transparent);overflow-x:auto;font-family:var(--font-mono);font-size:10px;line-height:1.7;color:var(--fg-2);white-space:pre}
.bubble.rich pre code{background:transparent;border:0;padding:0;font-size:inherit;color:inherit;white-space:pre}
.sys-line{gap:9px;font-size:9px;color:var(--meta)}
.sys-line .sys-label{max-width:74%;text-align:center;line-height:1.6}
details.aux{margin-top:6px;border-color:var(--border-soft);background:color-mix(in oklab,var(--fg) 1.4%,transparent);border-radius:4px}
details.aux summary{padding:5px 8px;font-size:9.5px;font-weight:400;color:var(--meta);gap:5px}
details.aux summary:hover{color:var(--fg-2);background:color-mix(in oklab,var(--fg) 2%,transparent)}
details.aux summary .svg-i{width:10px;height:10px}
details.aux .aux-body{padding:7px 9px;border-top-color:var(--border-soft);font-size:10px;line-height:1.7;color:var(--muted)}
.tool-row{gap:6px;padding:3px 0;font-size:10px}
.t-type{font-size:8.5px;padding:0 4px;border-color:var(--border-soft);color:var(--muted)}
details.file{border-color:var(--border-soft);background:color-mix(in oklab,var(--fg) 1.3%,transparent);margin-bottom:8px;border-radius:5px}
details.file summary{padding:8px 10px;font-size:10.5px;color:var(--fg-2);gap:6px}
.f-name{font-size:10px;font-weight:510}
.file-path{font-size:8.5px;color:var(--meta)}
pre.code{font-size:10px;line-height:1.75;border-color:var(--border-soft);padding:10px 11px;max-height:360px;background:color-mix(in oklab,var(--bg) 72%,transparent)}
.pre-badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:8.5px;color:var(--meta);margin-left:auto}
.typing-row{display:flex;flex-direction:column;align-items:flex-end;align-self:flex-end;max-width:84%;gap:4px}
.typing-meta{font-family:var(--font-mono);font-size:8.5px;color:var(--meta);display:flex;align-items:center;gap:5px}
.typing-bubble{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid var(--border-soft);border-radius:var(--radius-md);background:color-mix(in oklab,var(--surface) 36%,var(--bg));color:var(--muted);font-size:10px}
.typing-dots{display:inline-flex;align-items:center;gap:3px}
.typing-dots i{width:3px;height:3px;border-radius:50%;background:var(--fg-2);display:block;animation:typing 1.2s ease-in-out infinite}
.typing-dots i:nth-child(2){animation-delay:.15s}
.typing-dots i:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-1px)}}
.detail-side{gap:15px}
.side-card{border-color:var(--border-soft)}
.side-card .panel-head{padding:11px 13px}
.side-card .panel-title{font-size:10.5px;color:var(--fg-2);gap:6px}
.side-card .panel-body{padding:0}
.side-body{max-height:332px;overflow-y:auto;overflow-x:hidden;min-width:0}
.side-row{width:100%;padding:8px 13px;gap:2px;text-align:left;color:inherit;border-left:0;border-right:0;border-top:0;border-radius:0}
button.side-row{background:transparent}
.side-row+.side-row{border-top:0}
.side-main{font-size:11px;line-height:1.6;color:var(--fg-2);gap:5px}
.side-main .svg-i{color:var(--meta)}
.side-tag{font-size:9px;color:var(--meta);font-family:var(--font-mono)}
.side-meta{font-size:9px;color:var(--meta);gap:5px}
.side-meta .mono{font-size:8.5px}
.side-dot{width:5px;height:5px;margin-top:4px}
.err-text{color:color-mix(in oklab,var(--danger) 20%,var(--fg))}
.side-row.clickable:hover{background:color-mix(in oklab,var(--fg) 3.4%,transparent)}
.side-row.clickable:focus-visible{outline-offset:-2px}
.empty-note{font-size:10px;line-height:1.65;color:var(--meta);padding:12px 13px}
.side-card .empty-note{padding:12px 13px}
.cnt-warn{color:color-mix(in oklab,var(--warn) 68%,var(--fg));border-color:color-mix(in oklab,var(--warn) 22%,transparent)}
.task-error-line{font-family:var(--font-mono);font-size:8.5px;line-height:1.6;color:color-mix(in oklab,var(--danger) 20%,var(--fg));padding:5px 6px;border-radius:3px;background:color-mix(in oklab,var(--danger) 5%,transparent);margin-top:3px}
.copy-state{font-size:9px;color:var(--meta)}

/* ── config ─────────────────────────────────────────────────────── */
.legend{margin-bottom:14px;padding:8px 11px;border-color:var(--border-soft);background:color-mix(in oklab,var(--fg) 1.5%,var(--bg));font-size:10px;color:var(--muted);gap:7px}
.legend .svg-i{width:12px;height:12px;color:color-mix(in oklab,var(--warn) 60%,var(--fg))}
.cfg-nav{display:flex;flex-wrap:wrap;gap:3px;padding:5px;margin-bottom:14px;border:1px solid var(--border-soft);border-radius:6px;background:color-mix(in oklab,var(--fg) 1.4%,var(--bg))}
.cfg-nav-btn{height:25px;padding:0 8px;border:1px solid transparent;border-radius:4px;color:var(--muted);font-size:9.5px;line-height:1;white-space:nowrap;transition:background var(--motion-fast) var(--ease-standard),color var(--motion-fast) var(--ease-standard),border-color var(--motion-fast) var(--ease-standard)}
.cfg-nav-btn:hover{background:color-mix(in oklab,var(--fg) 4%,transparent);color:var(--fg-2)}
.cfg-nav-btn.active,.cfg-nav-btn[aria-current="true"]{background:color-mix(in oklab,var(--fg) 6%,var(--bg));border-color:var(--border-soft);color:var(--fg)}
.cfg-group{scroll-margin-top:70px;margin-bottom:14px}
.cfg-group .panel-head{padding:11px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:color-mix(in oklab,var(--fg) 1.3%,transparent)}
.cfg-group .panel-title{font-size:11px;color:var(--fg-2)}
.cfg-group-count{font-family:var(--font-mono);font-size:8.5px;color:var(--meta)}
.cfg-grid{gap:16px 20px;padding:16px}
.field label{font-size:11px;color:var(--fg-2)}
.field-help{font-size:10px;color:var(--muted);max-width:unset}
.input{font-size:12px}
.rst-badge{height:17px;font-size:9px;padding:0 5px;gap:3px;color:color-mix(in oklab,var(--warn) 66%,var(--fg));background:color-mix(in oklab,var(--warn) 7%,transparent);border-color:color-mix(in oklab,var(--warn) 20%,transparent)}
.rst-badge .svg-i{width:9px;height:9px}
.switch{width:34px;height:19px}
.switch .knob{width:13px;height:13px;top:3px;left:3px}
.switch input:checked+.track .knob{transform:translateX(15px)}
.switch input:checked+.track{background:color-mix(in oklab,var(--fg) 80%,var(--bg));border-color:color-mix(in oklab,var(--fg) 45%,transparent)}
.switch input:checked+.track .knob{background:var(--bg)}
.switch-label{font-size:10.5px;color:var(--muted)}
.cfg-actions{position:sticky;top:64px;bottom:auto;z-index:18;margin:0 0 12px;padding:9px 11px;background:color-mix(in oklab,var(--surface) 80%,var(--bg));border-color:var(--border);border-radius:7px;box-shadow:0 8px 30px color-mix(in oklab,var(--bg) 55%,transparent),var(--elev-ring);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.cfg-actions .spin .svg-i{animation:rot .9s linear infinite}
.cfg-actions .cfg-status{display:inline-flex;align-items:center;gap:6px;min-width:0}
.cfg-actions .cfg-status .spin{display:inline-flex;color:var(--muted)}
.cfg-actions .cfg-status .dot{width:5px;height:5px;background:var(--warn)}
.cfg-status{font-size:10.5px;color:var(--meta)}
.cfg-actions-right{gap:12px}
.cfg-actions .btn-primary{height:31px;font-size:11.5px}
.cfg-json-panel{border-color:var(--border-soft)}
.cfg-json-panel .panel-body{padding:10px}
#cfg-json-ta{min-height:440px;font-size:10.5px;line-height:1.7;border-color:var(--border-soft);background:color-mix(in oklab,var(--bg) 65%,transparent)}
.cfg-empty{padding:34px 20px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.cfg-error{padding:30px 20px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:560px}
.cfg-error .empty-title{color:var(--fg-2)}

/* ── detail/file/config additions ───────────────────────────────── */
.back-btn{flex:none;height:28px;padding:0 6px;border-color:transparent;background:transparent;color:var(--meta);font-size:10px;gap:4px;margin-top:4px}
.back-btn:hover{color:var(--fg-2);background:color-mix(in oklab,var(--fg) 4%,transparent);border-color:transparent}
.back-btn .svg-i{width:12px;height:12px}
.detail-title-row{min-width:0}
.detail-meta .chip{height:22px;padding:0 6px;gap:5px;color:var(--muted)}
.detail-meta .chip .svg-i{width:9px;height:9px;color:var(--meta)}
.detail-meta .copy-link{margin-left:-3px}
.detail-meta .meta-workspace{font-family:var(--font-mono);font-size:9px;line-height:1.5;color:var(--muted);vertical-align:bottom}
/* Keep informational micro-copy above the 4.5:1 contrast floor. --meta stays
   reserved for disabled text, dividers and decorative glyphs. */
.brand-sub,.side-label,.side-instance-mode,.side-token-state,.side-meta,
.foot-note,.bot-product,.bot-uptime span,.svc-desc,.count-sync,.split-label,
.os-meta,.os-time,.fact-label,.facts-foot,.lm-time,.lm-text,.session-ident-line,
.detail-meta,.back-btn,.hint,.send-target-note,.file-size,.file-path,.pre-badge,
.msg-meta,.m-time,.m-model,.m-synthetic,.sys-line,details.aux summary,.side-tag,
.empty-note,.typing-meta,.eyebrow,.cfg-group-count,.cfg-status,.modal-meta,
.search kbd,.count-badge,.count-total-label,.side-instance-mode,.muted-dash,
.session-time,.panel-sub,.tbl th,.detail-actions .btn .mono,.file-empty{color:var(--muted)}
.session-ident-line .sid{opacity:1}
.side-card .panel-title .count-badge{color:var(--muted)}
.m-synthetic{border-color:var(--border-soft)}
.modal-title{padding-right:26px}
.side-card .count-badge.warn{color:color-mix(in oklab,var(--warn) 68%,var(--fg))}
.cfg-head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.view-title,.bot-name,.panel-title,.empty-title,.modal-title{text-wrap:balance}
.empty-text,.state-copy,.modal-text,.field-help,.toast .t-msg{text-wrap:pretty}
/* Legibility floor: operational metadata never drops below 9.5px. */
.brand-sub,.side-label,.side-instance-mode,.side-token-state,.bot-product,
.count-sync,.split-label,.os-meta,.os-time,.os-pending,.os-busy,.fact-label,
.fact-value,.facts-foot,.session-ident-line,.lm-time,.tbl th,.m-synthetic,
.sys-line,.side-tag,.side-meta,.cfg-group-count,.modal-meta,.file-size,.file-path,
.pre-badge,.eyebrow,.typing-meta,.detail-meta .mono,.detail-actions .btn .mono,
.search kbd,.count-badge{font-size:9.5px}
.bot-uptime strong{font-size:11px}
.svc-desc,.tbl .lm-who,.aux-body,.file-empty,.empty-note,.cfg-nav-btn{font-size:10.5px}
.svc-endpoint,.svc-state,.os-title,.bot-uptime span,.msg-meta,.detail-meta,
.side-tag,.msg-meta .m-model{font-size:10px}
.os-title{font-size:12px}
.os-preview,.lm-text,.cell-title,.side-main{font-size:11.5px}
.svc-desc{font-size:10.5px}
.panel-sub,.field-help,.cfg-status{font-size:10.5px}
.modal-text{font-size:11.5px}
.aux-body{font-size:11px}
.tool-row{font-size:10.5px}
.modal-meta{font-size:9.5px}

.side-card .panel-title .count-badge{margin-left:1px}
.side-card .panel-title{display:flex;align-items:center;gap:6px}
.eyebrow{font-family:var(--font-mono);font-size:8px;line-height:1.4;letter-spacing:.08em;text-transform:uppercase;color:var(--meta)}
.file-workspace{display:flex;align-items:center;gap:7px;padding:0 2px 9px;min-width:0;overflow:hidden;border-bottom:1px solid var(--border-soft);margin-bottom:9px}
.file-workspace .mono{font-size:8.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.file-size{font-family:var(--font-mono);font-size:8.5px;color:var(--meta);margin-left:auto;white-space:nowrap;flex:none}
.file-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 8px 4px 11px;border-top:1px solid var(--border-soft);background:color-mix(in oklab,var(--bg) 55%,transparent)}
.file-toolbar .file-path{margin-left:0;max-width:calc(100% - 28px);flex:1;min-width:0}
.file-toolbar .copy-link{flex:none}
.file-empty{padding:13px 11px;font-size:10px;color:var(--meta)}
.f-chev-wrap{display:inline-flex;color:var(--meta);margin-left:auto}
details.file summary .f-chev{width:12px;height:12px;margin-left:auto;color:var(--meta)}
details.file summary .file-size+.f-chev{margin-left:0}
.preview-note{font-family:var(--font-mono);font-size:8.5px;color:var(--meta);padding:2px 10px 8px}
.bool-control{display:flex;align-items:center;gap:8px;min-height:32px}
.bool-state{font-size:10px;line-height:1.4;color:var(--muted)}
.field-json{grid-column:1 / -1}
.field-json textarea{min-height:112px}
.field-json .field-help{margin-top:1px}
.cfg-json-help{margin-top:6px}
#cfg-json-ta[aria-invalid="true"]{border-color:color-mix(in oklab,var(--danger) 60%,transparent)}
.modal{position:relative}
.modal-x{position:absolute;right:9px;top:9px;width:25px;height:25px;display:grid;place-items:center;border:0;border-radius:4px;background:transparent;color:var(--meta);cursor:pointer;z-index:1}
.modal-x:hover{background:color-mix(in oklab,var(--fg) 6%,transparent);color:var(--fg-2)}
.modal-x .svg-i{width:12px;height:12px}
.modal .field.token-field{margin-top:13px;margin-bottom:12px}
.modal .modal-note{display:flex;align-items:flex-start;gap:7px;padding:8px 9px;margin-top:9px;border:1px solid color-mix(in oklab,var(--danger) 20%,transparent);border-radius:5px;background:color-mix(in oklab,var(--danger) 5%,transparent);font-size:10px;line-height:1.65;color:color-mix(in oklab,var(--danger) 16%,var(--muted))}
.modal .modal-note .svg-i{width:12px;height:12px;color:color-mix(in oklab,var(--danger) 35%,var(--fg));flex:none;margin-top:1px}
.modal .modal-note span{min-width:0;overflow-wrap:anywhere}
.side-token:focus-visible,.nav-item:focus-visible{outline-offset:-2px}
.cfg-nav-btn:focus-visible{outline-offset:0}
.toast .t-close:focus-visible{outline-offset:0}
.switch input:focus-visible+.track{outline:2px solid var(--accent-hover);outline-offset:2px;box-shadow:var(--focus-ring)}
.bot-avatar .svg-i{width:20px;height:20px}
.seg button:disabled{opacity:.48;cursor:not-allowed}
.seg button:disabled:hover{color:var(--muted);background:transparent}
.copy-link,.f-chev,.search .svg-i,.os-arrow,.modal-x,.t-close,.side-token .svg-i,
.side-nav .nav-ico,.detail-meta .chip .svg-i{color:var(--muted)}
.copy-link:hover,.modal-x:hover,.t-close:hover{color:var(--fg-2)}

/* ── toasts / modal ─────────────────────────────────────────────── */

<script>
'use strict';
/* ═══════════════════════ 工具 ═══════════════════════ */
var $ = function(sel, el){ return (el||document).querySelector(sel); };
var $$ = function(sel, el){ return Array.prototype.slice.call((el||document).querySelectorAll(sel)); };
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function shortId(id){
  var s=String(id||'');
  if(!s) return '—';
  return s.length>12?s.slice(0,8)+'…'+s.slice(-3):s;
}
function fmtClock(d){
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
function fmtTime(sec){
  if(sec==null||sec==='') return '—';
  var d=new Date(Number(sec)*1000);
  if(isNaN(d.getTime())) return '—';
  var now=new Date();
  var hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(d.toDateString()===now.toDateString()) return hm;
  var y=new Date(now); y.setDate(now.getDate()-1);
  if(d.toDateString()===y.toDateString()) return '昨天 '+hm;
  return (d.getMonth()+1)+'-'+d.getDate()+' '+hm;
}
function fmtRelative(sec){
  if(sec==null||sec==='') return '—';
  var d=new Date(Number(sec)*1000);
  if(isNaN(d.getTime())) return '—';
  var diff=Math.round((Date.now()-d.getTime())/1000);
  if(diff<0) return fmtTime(sec);
  if(diff<10) return '刚刚';
  if(diff<60) return diff+' 秒前';
  if(diff<3600) return Math.floor(diff/60)+' 分钟前';
  if(diff<86400) return Math.floor(diff/3600)+' 小时前';
  if(diff<604800) return Math.floor(diff/86400)+' 天前';
  return fmtTime(sec);
}
function fmtDate(sec){
  if(sec==null||sec==='') return '—';
  var d=new Date(Number(sec)*1000);
  if(isNaN(d.getTime())) return '—';
  return (d.getMonth()+1)+'-'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function fmtUptime(sec){
  if(sec==null||sec==='') return '—';
  if(typeof sec==='string'&&!/^\d+(\.\d+)?$/.test(sec.trim())) return sec;
  var n=Number(sec);
  if(!isFinite(n)) return '—';
  sec=Math.max(0, Math.floor(n));
  var d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60);
  if(d>0) return d+' 天 '+h+' 小时';
  if(h>0) return h+' 小时 '+m+' 分';
  return m+' 分';
}
function formatNumber(n){
  var v=Number(n);
  return isFinite(v)?String(v):'—';
}
function formatFileSize(text){
  var s=String(text==null?'':text), bytes=s.length;
  try{ bytes=new TextEncoder().encode(s).length; }catch(_){}
  return bytes<1024?bytes+' B':(bytes/1024).toFixed(1)+' KB';
}
function renderMarkdown(text){
  var src=String(text==null?'':text);
  var out='', pos=0, match;
  var fence=/```([^\n`]*)\n?([\s\S]*?)```/g;
  while((match=fence.exec(src))){
    out+=richInline(src.slice(pos,match.index));
    out+='<pre><code>'+esc(match[2].replace(/\n$/,''))+'</code></pre>';
    pos=match.index+match[0].length;
  }
  out+=richInline(src.slice(pos));
  return out;
}
function richInline(text){
  var safe=esc(text||'');
  safe=safe.replace(/`([^`\n]+)`/g,function(_,code){ return '<code>'+code+'</code>'; });
  safe=safe.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  safe=safe.replace(/\n/g,'<br>');
  return safe;
}

      }).sort(function(a,b){ return (b.lastMessage&&b.lastMessage.time||0)-(a.lastMessage&&a.lastMessage.time||0); });
    },
    detail:function(scope){
      var d=details[scope];
      return d?deepCopy(d):null;
    },
    action:function(scope, body){
      var d=details[scope];
      if(!d){ var e1=new Error('会话不存在：'+scope); e1.status=404; throw e1; }
      body=body||{};
      if(body.action==='reset'){
        d.ocMessages=[{role:'system', text:'会话记忆已清空，下一条 QQ 消息将建立新的上下文。', time:Math.floor(Date.now()/1000), synthetic:true}];
        d.pending=[];
        d.busy=false;
        d.tasks=d.tasks.map(function(t){ return {task_id:t.task_id,status:'done',task:t.task,created_at:t.created_at,summary:'已重置',error:null}; });
        return {ok:true, message:'已清空会话记忆（/reset）'};
      }
      if(body.action==='abort'){
        if(!d.busy) return {ok:true, message:'当前没有正在执行的生成'};
        d.busy=false;
        d.tasks=d.tasks.map(function(t){ return t.status==='running'?{task_id:t.task_id,status:'aborted',task:t.task,created_at:t.created_at,summary:'用户打断',error:null}:t; });
        return {ok:true, message:'已打断当前生成（/abort）'};
      }
      if(body.action==='send'){
        var text=String(body.text||'').trim();
        if(!text){ var e2=new Error('text 不能为空'); e2.status=400; throw e2; }
        if(body.target==='agent'){
          d.ocMessages.push({role:'user', text:text, time:Math.floor(Date.now()/1000)});
          d.busy=true;
          setTimeout(function(){
            d.ocMessages.push({role:'assistant', text:'（演示回复）收到，我先看一下。接入真实后端后，这里会是 OpenCode 的流式回复。', model:d.info.model, time:Math.floor(Date.now()/1000)});
            d.busy=false;
          }, 2600);
          return {ok:true, message:'已作为 prompt 发给 Agent'};
        }
        var sentAt=Math.floor(Date.now()/1000);
        d.qqMessages.push({time:sentAt, nickname:d.botName, user_id:d.selfId, text:text, isBot:true});
        d.lastMessage={time:sentAt, nickname:d.botName, user_id:d.selfId, text:text};
        d.todayCount=(d.todayCount||0)+1;
        return {ok:true, message:'已发送到 QQ（以机器人身份）'};
      }
      var e3=new Error('未知 action：'+body.action); e3.status=400; throw e3;
    },
    config:function(){
      return {config:deepCopy(cfg), fields:FIELDS, restartKeys:RESTART.slice(), file:'config.json', version:12};
    },
    saveConfig:function(body){
      var c=body&&body.config;
      if(!c||typeof c!=='object'||Array.isArray(c)){ var e=new Error('config 必须是一个 JSON 对象'); e.status=400; throw e; }
      var changed=Object.keys(c).filter(function(k){ return JSON.stringify(c[k])!==JSON.stringify(cfg[k]); });
      var applied=[], restartRequired=[], ignored=[];
      changed.forEach(function(k){ (RESTART.indexOf(k)>-1?restartRequired:applied).push(k); });
      Object.assign(cfg, c);
      return {saved:true, file:'config.json', applied:applied, restartRequired:restartRequired, ignored:ignored, config:deepCopy(cfg)};
    }
  };
}
var MOCK=buildMock();
function mockApi(path, opts){
  return sleep(120+Math.random()*260).then(function(){
    var method=(opts&&opts.method||'GET').toUpperCase();
    var m;
    if(path==='/status') return MOCK.status();
    if(path==='/sessions') return {sessions:MOCK.sessions()};
    m=path.match(/^\/sessions\/([^/]+)$/);
    if(m){ var d=MOCK.detail(decodeURIComponent(m[1])); if(!d){ var e1=new Error('会话不存在：'+m[1]); e1.status=404; throw e1; } return d; }
    m=path.match(/^\/sessions\/([^/]+)\/action$/);
    if(m) return MOCK.action(decodeURIComponent(m[1]), opts&&opts.body||{});
    if(path==='/config'){
      if(method==='PUT') return MOCK.saveConfig(opts&&opts.body||{});
      return MOCK.config();
    }
    var e2=new Error('mock 未实现：'+method+' '+path); e2.status=404; throw e2;
  });
}

/* ═══════════════════════ API 层 ═══════════════════════ */
async function api(path, opts){
  if(S.demo) return mockApi(path, opts);
  opts=opts||{};
  var headers=Object.assign({},opts.headers||{});
  if(S.token) headers['Authorization']='Bearer '+S.token;
  if(opts.body!=null&&!headers['Content-Type']) headers['Content-Type']='application/json';
  var init=Object.assign({},opts);
  init.headers=headers;
  init.body=opts.body!=null?JSON.stringify(opts.body):undefined;
  init.method=opts.method||'GET';
  init.cache='no-store';
  init.credentials='same-origin';
  if(!init.headers['Accept']) init.headers['Accept']='application/json';
  if(typeof AbortSignal!=='undefined'&&AbortSignal.timeout) init.signal=AbortSignal.timeout(8000);
  var res;
  try{
    res=await fetch('/api'+path,init);
  }catch(err){
    var e1=new Error('无法连接本地面板接口');
    e1.network=true;
    throw e1;
  }
  var data=null;
  try{ data=await res.json(); }catch(_){ data=null; }
  if(res.status===401){
    var authMessage=(data&&data.error)?String(data.error):'接口要求面板 Token';
    if(!S.tokenPrompted){ S.tokenPrompted=true; openTokenModal(authMessage); }
    var e2=new Error(authMessage);
    e2.unauthorized=true; e2.status=401;
    throw e2;
  }
  if(!res.ok){
    var e3=new Error((data&&data.error)?String(data.error):('请求失败（HTTP '+res.status+'）'));
    e3.status=res.status; e3.data=data;
    throw e3;
  }
  if(data===null){
    var e4=new Error('接口返回了无法解析的响应');
    e4.status=res.status;
    throw e4;
  }
  return data;
}

/* ═══════════════════════ 刷新 ═══════════════════════ */
function safeSessionList(value){
  var list=value&&value.sessions;
  if(!Array.isArray(list)) return [];
  return list.filter(function(item){ return item&&typeof item==='object'; });
}
async function refreshOverview(manual){
  var btn=$('#view-overview [data-action="ov-refresh"]');
  if(btn&&manual){ btn.classList.add('spin'); btn.setAttribute('aria-busy','true'); }
  var previousScroll=window.scrollY;
  try{
    var out=await Promise.allSettled([api('/status'), api('/sessions')]);
    var firstError=null;
    var statusOk=out[0].status==='fulfilled';
    var sessionsOk=out[1].status==='fulfilled';
    if(statusOk){ S.status=out[0].value; }
    else { firstError=out[0].reason; }
    if(sessionsOk){
      S.sessions=safeSessionList(out[1].value);
      S.sessionsError=null;
    }else{
      S.sessionsError=friendlyError(out[1].reason);
      if(!firstError) firstError=out[1].reason;
    }
    if(statusOk){ S.lastSync=new Date(); updateHealth(S.status); }
    updateNavCount();
    if(!firstError){ S.lastRefreshOk=true; S.refreshStreak=0; updateApiDot(); }
    else { S.lastRefreshOk=false; S.refreshStreak++; updateApiDot(); }
    if(S.view==='overview') renderOverview();
    if(firstError&&(manual||S.refreshStreak===1)) toast(friendlyError(firstError),'error',5200);
    if(manual&&!firstError) toast('数据已刷新','success',1800);
    if(S.view==='overview') window.scrollTo(0,previousScroll);
  }catch(err){
    S.lastRefreshOk=false; S.refreshStreak++;
    updateApiDot();
    if(manual||S.refreshStreak===1) toast(friendlyError(err),'error',5200);
    if(S.view==='overview') renderOverview();
  }finally{
    var liveBtn=$('#view-overview [data-action="ov-refresh"]');
    if(liveBtn){ liveBtn.classList.remove('spin'); liveBtn.removeAttribute('aria-busy'); }
  }
}
async function refreshSessions(manual){
  var btn=$('#view-sessions [data-action="se-refresh"]');
  if(btn&&manual){ btn.classList.add('spin'); btn.setAttribute('aria-busy','true'); }
  if(!$('#se-tbody')&&S.view==='sessions') renderSessions();
  S.sessionsLoading=true;
  try{
    var out=await api('/sessions');
    S.sessions=safeSessionList(out);
    S.sessionsError=null;
    S.lastRefreshOk=true; S.refreshStreak=0; S.lastSync=new Date();
    updateApiDot(); updateNavCount();
    if(S.view==='sessions'){ if($('#se-tbody')) renderSessionsTable(); else renderSessions(); }
    if(manual) toast('数据已刷新','success',1800);
  }catch(err){
    S.sessionsError=friendlyError(err);
    S.lastRefreshOk=false; S.refreshStreak++;
    updateApiDot();
    if(manual||S.refreshStreak===1) toast(friendlyError(err),'error',5200);
    if(S.view==='sessions'){ if(S.sessions&&$('#se-tbody')) renderSessionsTable(); else renderSessions(); }
  }finally{
    S.sessionsLoading=false;
    var liveBtn=$('#view-sessions [data-action="se-refresh"]');
    if(liveBtn){ liveBtn.classList.remove('spin'); liveBtn.removeAttribute('aria-busy'); }
  }
}
async function refreshDetail(manual){

async function tick(){
  if(document.hidden||S.refreshing) return;
  if($('#overlay')&&!$('#overlay').hidden) return;
  if(S.tokenPrompted) return;
  if(isTyping()) return;
  S.refreshing=true;
  try{
    if(S.view==='overview'){ await refreshOverview(false); return; }
    try{
      var st=await api('/status');
      S.status=st; S.lastRefreshOk=true; S.refreshStreak=0;
      updateHealth(st); updateNavCount();
    }catch(err){
      S.lastRefreshOk=false; S.refreshStreak++;
      updateApiDot();
      if(S.refreshStreak===1) toast('自动刷新失败：'+friendlyError(err),'error',5200);
    }
    if(S.view==='sessions'){ await refreshSessions(false); }
    else if(S.view==='detail'&&S.detail.data&&S.detail.data.busy){ await refreshDetail(false); }
  }finally{
    S.refreshing=false;
  }
}

}
function pendingTotal(){

  if(st.onebot&&st.onebot.connected===false){ issues.push('OneBot 已断开'); danger=true; }
  var failed=dataCount(st.tasks&&st.tasks.error);

  var pending=pendingTotal();
  if(pending===null&&S.sessionsError){ issues.push('会话列表未同步'); }

function renderSessionsTable(){
  var tbody=$('#se-tbody');
  if(!tbody) return;
  var sub=$('#se-sub'), foot=$('#se-foot'), notice=$('#se-notice');
  var viewRoot=$('#view-sessions');
  if(notice) notice.innerHTML=sessionNoticeHTML();
  if(S.sessions===null){
    if(S.sessionsError){
      tbody.innerHTML='<tr><td colspan="5"><div class="empty-state">'+icon('warn','empty-ic')
        +'<div class="empty-title">无法加载会话列表</div>'
        +'<div class="empty-text">'+esc(S.sessionsError)+'</div>'
        +'<button class="btn btn-sm" type="button" data-action="se-refresh">重试连接</button></div></td></tr>';
      if(sub) sub.textContent='连接失败';
      if(viewRoot) viewRoot.setAttribute('aria-busy','false');
    }else{
      tbody.innerHTML=skeletonRows();
      if(sub) sub.textContent='正在读取会话索引…';
      if(viewRoot) viewRoot.setAttribute('aria-busy','true');
    }
    if(foot) foot.textContent='';
    return;
  }
  if(viewRoot) viewRoot.setAttribute('aria-busy','false');
  var list=S.sessions;
  var q=S.q.trim().toLowerCase();
  var rows=list;
  if(S.busyOnly) rows=rows.filter(function(s){ return s.busy; });
  if(q) rows=rows.filter(function(s){
    return [s.scope,s.title,s.sessionId,s.workspace,s.botName,(s.lastMessage&&s.lastMessage.text),(s.lastMessage&&s.lastMessage.nickname)]
      .some(function(x){ return x!=null&&String(x).toLowerCase().indexOf(q)>-1; });
  });
  var busyN=list.filter(function(s){ return s.busy; }).length;
  var pendingN=list.reduce(function(sum,s){ return sum+dataCount(s.pending); },0);
  if(sub) sub.textContent='共 '+list.length+' 个会话 · '+busyN+' 个生成中 · '+pendingN+' 条待回应';
  if(foot) foot.textContent='最后更新 '+(S.lastSync?fmtClock(S.lastSync):'—');
  if(!rows.length){
    var filtered=!!(q||S.busyOnly);
    tbody.innerHTML='<tr><td colspan="5"><div class="empty-state">'
      +icon(filtered?'search':'info','empty-ic')
      +'<div class="empty-title">'+(filtered?'没有匹配的会话':'还没有会话')+'</div>'
      +'<div class="empty-text">'+(filtered?'换一个关键词，或清除筛选条件后再试。':'当机器人收到消息并建立 OpenCode 会话后，记录会出现在这里。')+'</div>'
      +(filtered?'<button class="btn btn-sm" type="button" data-action="clear-filter">清除筛选</button>':'<button class="btn btn-sm" type="button" data-action="se-refresh">立即刷新</button>')
      +'</div></td></tr>';
    return;
  }
  tbody.innerHTML=rows.map(function(s){ return sessionRowHTML(s); }).join('');
}

function renderConv(){
  var el=$('#conv-scroll');
  if(!el) return;
  var d=S.detail.data;
  var key=S.detail.scope+':'+S.detail.tab;
  var sameTab=el.dataset.tabKey===S.detail.tab&&el.dataset.rendered==='1';
  var had=el.dataset.rendered==='1';
  var atBottom=had?el.scrollHeight-el.scrollTop-el.clientHeight<32:true;
  var previousKey=el.dataset.scrollKey;
  var openKeys=[];
  var focusedDetail=null;
  if(had){
    if(previousKey) S.scroll[previousKey]=el.scrollTop;
    if(sameTab){
      openKeys=$$('#conv-scroll details[open][data-dkey]').map(function(x){return x.dataset.dkey;});
      var ae=document.activeElement;
      if(ae&&ae.closest&&ae.closest('#conv-scroll details[data-dkey]')) focusedDetail=ae.closest('#conv-scroll details[data-dkey]').dataset.dkey;
    }
  }
  var html='';
  if(!d){ html=msgSkeleton(); }

    html='<div class="empty-state">'+icon('warn','empty-ic')+'<div class="empty-title">无法加载会话</div><div class="empty-text">'+esc(friendlyError(S.detail.error))+'</div><button class="btn btn-sm" type="button" data-action="dt-refresh">重试加载</button></div>';
  }
  else if(S.detail.tab==='agent') html=renderAgentConv(d);
  else if(S.detail.tab==='qq') html=renderQQConv(d);
  else html=renderFiles(d);
  el.innerHTML=html;
  el.dataset.rendered='1';
  el.dataset.tabKey=S.detail.tab;
  el.dataset.scrollKey=key;
  el.setAttribute('aria-labelledby','tab-'+(S.detail.tab==='agent'?'agent':S.detail.tab));
  if(had&&sameTab){
    $$('#conv-scroll details[data-dkey]').forEach(function(x){
      x.open=openKeys.indexOf(x.dataset.dkey)>-1;
    });
  }
  if(focusedDetail){
    var target=$$('#conv-scroll details[data-dkey]').filter(function(x){return x.dataset.dkey===focusedDetail;})[0];
    var summary=target?target.querySelector('summary'):null;
    if(summary) summary.focus({preventScroll:true});
  }
  var saved=S.scroll[key];
  if(!had||saved==null||(sameTab&&atBottom)) el.scrollTop=el.scrollHeight;
  else el.scrollTop=saved;
}

async function doSend(){
  var el=$('#send-input');
  if(!el||S.detail.sending) return;
  var text=el.value.trim();
  if(!text){ el.focus(); return; }
  var target=S.detail.target;
  S.detail.sending=true;
  updateComposerUI();
  try{
    var res=await api('/sessions/'+encodeURIComponent(S.detail.scope)+'/action', {method:'POST', body:{action:'send', target:target, text:text}});
    if(res&&res.error) throw new Error(res.error);
    el.value=''; saveDraft();
    toast(res&&res.message?res.message:(target==='qq'?'已发送到 QQ':'已发送给 Agent'),'success');
    await refreshDetail(false);
  }catch(err){
    if(err.status!==401) toast(friendlyError(err),'error');
  }finally{
    S.detail.sending=false;
    updateComposerUI();
    var overlay=$('#overlay');
    var liveInput=$('#send-input');
    if(liveInput&&(!overlay||overlay.hidden)) liveInput.focus();
  }
}

async function copyValue(value,label){
  if(value==null||value===''){ toast('没有可复制的内容','info',2400); return; }
  var done=false;
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(String(value)); done=true; }
  }catch(_){}
  if(!done){
    try{
      var ta=document.createElement('textarea');
      ta.value=String(value);
      ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();
      done=document.execCommand('copy');ta.remove();
    }catch(_){ done=false; }
  }
  toast(done?('已复制 '+(label||'内容')):'复制失败，请手动选择内容',done?'success':'error',2400);
}

var CFG_TYPES={string:1,number:1,boolean:1,password:1,json:1};
function normalizeConfigFields(raw){
  var out=[], seen={};
  (Array.isArray(raw)?raw:[]).forEach(function(f){
    if(!f||f.key==null) return;
    var key=String(f.key);
    if(!key||seen[key]) return;
    seen[key]=1;
    var type=CFG_TYPES[f.type]?f.type:'string';
    var min=f.min!=null&&f.min!==''?Number(f.min):null;
    var max=f.max!=null&&f.max!==''?Number(f.max):null;
    out.push({
      key:key,
      label:String(f.label||key),
      group:String(f.group||'其他'),
      type:type,
      help:String(f.help||''),
      min:Number.isFinite(min)?min:null,
      max:Number.isFinite(max)?max:null,
      __id:'cfg-field-'+out.length
    });
  });
  return out;
}
function cfgValueText(v){
  if(v===undefined) return '';

  if(typeof v==='object') { try{ return JSON.stringify(v,null,2); }catch(_){ return String(v); } }
  return String(v);
}
